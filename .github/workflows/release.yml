name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          ABBFAD: ${{ secrets.ABBFAD }}
          B2C80C: ${{ secrets.B2C80C }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('ABBFAD', '')
          tag_b = os.environ.get('B2C80C', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- cd759f23e3095df0b1 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 8b4b5821cb24c8975902e4d7ee04aba2 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
